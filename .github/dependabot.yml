# Keeps the commit-SHA pins in .github/workflows current: third-party actions are pinned
# to a full commit (with the version as a comment), so a moved or hijacked tag can't change
# what runs next to the release-signing keystore.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
