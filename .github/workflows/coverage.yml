name: Coverage

# Combined unit + instrumented coverage report, from the instrumented-test-coverage
# artifact ci.yml's instrumented-tests job uploads earlier in the same run. Called by
# ci.yml on its own runs (PRs, manual runs), and by create-release.yml next to its
# release job, so publishing a release doesn't wait for the report.

on:
  workflow_call:

jobs:
  coverage-report:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Download Instrumented Test Coverage Data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: instrumented-test-coverage
          path: app/build/outputs/code_coverage/debugAndroidTest/connected

      # Re-runs unit tests here (cheap, no device needed) purely to
      # regenerate the .exec file jacocoTestReport needs from a fresh
      # classpath — the instrumented .ec downloaded above is the one piece
      # that genuinely can't be regenerated without a device.
      - name: Generate Coverage Report
        run: |
          chmod +x gradlew
          ./gradlew jacocoTestReport --stacktrace

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html
