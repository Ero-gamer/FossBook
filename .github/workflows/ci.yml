name: CI

# Build/test validation, reusable by create-release.yml (workflow_call) so the
# actual release pipeline runs the exact same checks instead of duplicating
# them. Runs on every PR too — this is what makes PR checks show "CI / ..."
# instead of the misleading "Create Release / ..." they showed before the split.
#
# Deliberately has no access to signing secrets: only create-release.yml's
# own job (not this reusable workflow) handles the keystore, so a PR run
# never touches release-signing credentials.
#
# Use Ubuntu 26.04 across CI jobs for current GitHub-hosted tooling.

on:
  pull_request:
  # Run by hand on a branch (gh workflow run ci.yml --ref <branch>), e.g. to try
  # workflow changes before they reach main.
  workflow_dispatch:
  workflow_call:
    inputs:
      version_name:
        description: 'Version to bake into the APK (e.g. 1.1.1, no "v" prefix). Empty on plain PR runs, which keep build.gradle.kts local dev default.'
        type: string
        required: false
        default: ''
      coverage:
        description: 'Generate the coverage report in the instrumented-tests job. create-release.yml passes false and runs coverage.yml next to its release job instead, so publishing does not wait for it.'
        type: boolean
        required: false
        default: true

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Run Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --stacktrace

      - name: Upload Android Lint Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Run Unit Tests and Build APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          if [ -n "$VERSION_NAME" ]; then
            ./gradlew test assembleRelease -PversionNameOverride="$VERSION_NAME" --stacktrace
          else
            ./gradlew test assembleRelease --stacktrace
          fi
          ls -R app/build/outputs/apk || echo "No APK directory found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-artifact
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 5

  instrumented-tests:
    runs-on: ubuntu-26.04
    # A hung emulator otherwise runs to GitHub's 6-hour default. A normal run
    # takes ~8 minutes from the AVD cache; a cold AVD build fits well inside 30.
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Compile the app and test APKs before the emulator starts: the emulator
      # renders in software (swiftshader) and competing with it for the CPUs
      # made compiling take most of this job. connectedAndroidTest below then
      # finds them up to date and only installs and runs the tests.
      - name: Build App and Test APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # GitHub-hosted Ubuntu runners support nested virtualization but need
      # KVM permissions opened up explicitly for the emulator to use it.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A boot snapshot only loads in the emulator and system image it was made
      # with ("Snapshot file cannot be used, incompatible version" otherwise, and
      # every run cold-booted). Install both up front and put their versions in
      # the cache key, so a runner image update makes a fresh snapshot once.
      - name: Install Emulator and System Image
        id: avd-versions
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install emulator "system-images;android-34;google_apis;x86_64" > /dev/null
          VERSIONS=$("$SDKMANAGER" --list_installed 2>/dev/null |
            grep -E '^ *(emulator|system-images;android-34;google_apis;x86_64) ' |
            awk -F'|' '{gsub(/ /, "", $2); printf "%s-", $2}')
          echo "Installed versions: $VERSIONS"
          echo "key=${VERSIONS%-}" >> "$GITHUB_OUTPUT"

      # Caches the AVD image + boot snapshot, so a cache hit restores from the
      # snapshot instead of cold-booting. Not hashed on source: the AVD only
      # depends on the api-level/target/arch/profile below and the versions above.
      - name: AVD cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6-${{ steps.avd-versions.outputs.key }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedAndroidTest --stacktrace

      - name: Upload Instrumented Test Coverage Data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-coverage
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/**/*.ec
          if-no-files-found: warn

      # Combined coverage report, built from this job's own .ec. It's steps, not
      # a job, because release runs (coverage: false) make it in coverage.yml
      # next to their release job, and a skipped job would still show in their
      # graph. continue-on-error: the report never gates a PR.
      # inputs.coverage is empty on PR and manual runs; GitHub's loose == would
      # treat that like false, so compare it as text.
      - name: Generate Coverage Report
        if: format('{0}', inputs.coverage) != 'false'
        continue-on-error: true
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Upload Coverage Report
        if: format('{0}', inputs.coverage) != 'false'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html
