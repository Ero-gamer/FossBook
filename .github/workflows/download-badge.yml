name: Download badge

# The README's downloads badge: the total of every release's GitHub download
# count, written to badge.json on the data-only `stats` branch and shown with
# shields.io's endpoint badge. shields.io's own GitHub downloads badge counts
# only the newest 100 releases, and now and then shows "invalid".
on:
  schedule:
    - cron: '17 */3 * * *'  # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

# download-stats.yml pushes to the same branch.
concurrency: stats-branch

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stats branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stats

      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          total=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | ([.assets[].download_count] | add // 0)' | awk '{ s += $1 } END { print s + 0 }')
          # A failed or empty answer never replaces the last good count.
          [ "$total" -gt 0 ]
          printf '{"schemaVersion":1,"label":"Downloads","message":"%s","color":"1877F2"}\n' "$total" > badge.json

      - name: Commit when the count changed
        run: |
          git add badge.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "stats: downloads badge $(date -u +%F)"
          git push
